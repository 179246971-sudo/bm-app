<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Hihi Studio</title>

  <!-- 添加到主屏幕 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hihi Studio">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

  <!-- 微信里打开时的提示条 -->
  <div class="tipbar" id="tipbar" hidden>
    <span>要加到手机桌面？点右上角 <b>&#8943;</b> &rarr; <b>在浏览器打开</b>，再用浏览器菜单添加</span>
    <button type="button" id="tipclose" aria-label="关闭">&times;</button>
  </div>

  <!-- 入场页 -->
  <section class="entry" id="entry" hidden>
    <div class="entry-mark">h</div>
    <h1 class="entry-title">Hihi Studio</h1>
    <p class="entry-sub">请输入你的入场码</p>

    <input id="codeInput" class="entry-input" type="text"
           inputmode="latin" autocapitalize="characters" autocomplete="off"
           autocorrect="off" spellcheck="false" maxlength="8"
           placeholder="6 位字母或数字">

    <button id="codeBtn" class="btn entry-btn" type="button" disabled>进 入</button>

    <p class="entry-err" id="entryErr"></p>

    <p class="entry-hint">入场码是群主单独发给你的。<br>没收到、或者输不进去，请在群里问一下。</p>
  </section>

  <!-- 主界面 -->
  <div id="appView" hidden>
    <header class="hd">
      <div class="hd-top">
        <div class="hd-l">
          <h1 id="title">Hihi Studio</h1>
          <p class="sub is-link" id="sub"></p>
        </div>
        <span class="me-badge" id="me" hidden></span>
      </div>
    </header>

    <main id="board">
      <div class="loading">加载中…</div>
    </main>
  </div>

  <!-- 弹窗 -->
  <div class="mask" id="mask" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script src="grid.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
