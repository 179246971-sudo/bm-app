<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex,nofollow">
  <title>Hihi Studio · 管理后台</title>
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body class="admin">

  <header class="hd">
    <h1>Hihi Studio 后台</h1>
    <p class="sub" id="subhint">课表设置 · 代报名 · 删人</p>
  </header>

  <main>
    <!-- 登录 -->
    <section id="loginPanel" class="login-wrap">
      <div class="login-card">
        <div class="login-mark">h</div>
        <h2 class="login-title">管理员登录</h2>
        <p class="login-sub">仅限管理员 · 请勿分享密码</p>

        <div class="login-field">
          <input id="pwd" type="password" class="login-inp" autocomplete="current-password"
                 aria-label="管理员密码" placeholder="输入管理员密码">
          <button type="button" id="pwdEye" class="login-eye" aria-label="显示密码" title="显示密码">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <path d="M1.6 12S5.6 5.8 12 5.8 22.4 12 22.4 12 18.4 18.2 12 18.2 1.6 12 1.6 12Z"
                    fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <line class="eye-off" x1="4.5" y1="19.5" x2="19.5" y2="4.5"
                    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <button id="loginBtn" class="btn login-btn">进入后台</button>
        <div class="hint login-hint" id="loginHint"></div>
      </div>
    </section>

    <!-- 后台 -->
    <section id="appPanel" hidden>
      <nav class="tabs">
        <button class="tab on" data-tab="home">概览</button>
        <button class="tab" data-tab="manage">报名管理</button>
        <button class="tab" data-tab="schedule">课表设置</button>
        <button class="tab" data-tab="roster">会员管理</button>
        <button class="tab" data-tab="sys">系统管理</button>
      </nav>

      <!-- 概览 -->
      <div id="tab-home">
        <div id="homeBox"><div class="loading">加载中…</div></div>
      </div>

      <!-- 报名管理 -->
      <div id="tab-manage" hidden>
        <p class="tip">点任意格子：看名单、删人、代报名。<strong>已开课</strong>的格子只能看，不能改。</p>
        <div id="adminBoard"><div class="loading">加载中…</div></div>
      </div>

      <!-- 课表设置 -->
      <div id="tab-schedule" hidden>
        <p class="tip">每天可以不一样：周四想 15:00 开始，就只改周四那几行。每格都能单独关闭。</p>

        <div class="fld">
          <label>页面标题</label>
          <input id="cfgTitle" class="inp" maxlength="40">
        </div>
        <div class="fld">
          <label>副标题</label>
          <input id="cfgSub" class="inp" maxlength="80">
        </div>

        <div class="fld">
          <label>每人每天报名上限（节）</label>
          <input id="cfgMaxDay" class="inp" type="number" min="1" max="20" inputmode="numeric">
        </div>

        <div class="fld">
          <label>每节课时长（分钟）</label>
          <input id="cfgSlotMin" class="inp" type="number" min="15" max="300" step="5" inputmode="numeric">
        </div>

        <div class="fld">
          <label>会员页面显示</label>
          <label class="switch">
            <input type="checkbox" id="cfgShowStats">
            <span>显示「本周 / 本月 / 今年已报」次数</span>
          </label>
        </div>

        <div class="fld">
          <label>每周课表</label>
          <div id="dayEditor"></div>
          <button id="copyMon" class="btn small" type="button">把周一的课表复制到其他天</button>
        </div>

        <button id="saveBtn" class="btn primary">保存设置</button>
        <div class="hint" id="saveHint"></div>
      </div>

      <!-- 名单 -->
      <div id="tab-roster" hidden>
        <p class="tip">只有名单里的人、并且拿着对应入场码，才能进来看课表和报名。链接转发给别人也进不来。</p>

        <div class="fld">
          <label>批量添加（一行一个名字，也可以整列粘贴）</label>
          <textarea id="rosterInput" class="inp roster-ta" rows="5"
                    placeholder="小林&#10;阿May&#10;陈工"></textarea>
          <button id="rosterAdd" class="btn primary small">加入名单并生成入场码</button>
          <div class="hint" id="rosterHint"></div>
        </div>

        <div class="fld">
          <label>名单（共 <b id="rosterCount">0</b> 人，已入场 <b id="rosterIn">0</b> 人）</label>
          <div id="rosterList" class="roster-list"><div class="loading">加载中…</div></div>
        </div>

        <div class="fld">
          <label>导出名单（Excel 能直接打开）</label>
          <button id="exportThis" class="btn small" type="button">导出本周</button>
          <button id="exportNext" class="btn small" type="button">导出下周</button>
        </div>
      </div>
      <!-- 系统管理 -->
      <div id="tab-sys" hidden>
        <div class="fld">
          <label>次卡模板（充值时直接选，不用手填次数）</label>
          <div id="cardList" class="card-list"><div class="loading">加载中…</div></div>
          <button id="cardAdd" class="btn small" type="button">＋ 新建次卡</button>
        </div>

        <div class="fld">
          <label>系统日志（后台操作记录，最新 200 条）</label>
          <div id="logList" class="log-list"><div class="loading">加载中…</div></div>
          <button id="logRefresh" class="btn small" type="button">刷新</button>
          <button id="logExport" class="btn small" type="button">导出 CSV</button>
          <div class="hint" id="logHint"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="mask" id="mask" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script src="grid.js?v=14"></script>
  <script src="admin.js?v=14"></script>
</body>
</html>
